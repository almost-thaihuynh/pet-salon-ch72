<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <title>Forms</title>
</head>
<body>
    

    <section class="m-4">
        <h1>Product Registration</h1>

        <form class="bg-light p-4 border rounded mt-3">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input id="productName" class="form-control" type="text" id="" placeholder="Apple">
            </div>


            <div class="mb-3">
                <label class="form-label">Price</label>
                <input id="productPrice" class="form-control" type="text" id="" placeholder="12">


            <div class="mb-3">
                <label class="form-label">Category</label>
                <select id="productCategory" class="form-select" type="text" id="">
                    <option value="">Select a category</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Electronics">Electronics</option>
                </select>

            </div>

            <div class="d-flex justify-content-end gap-3">

                <button onclick="registerProduct(event)" class="btn btn-primary" type="submit">Register</button>
                
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>

        </form>

   

    </section>

    <section class="m-4">
        <h2>Registered Products</h2>
        
        <!-- TABLE -->
         <table class="table mt-4">
            <!--Table Header-->
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Delete</th>
            </tr>

            <!--TABLE BODY-->
            <tbody id="body">
                <tr>
                    <td>Apple</td>
                    <td>12</td>
                    <td>Fruits</td>
                    <td><button id="" class="btn btn-danger">Delete</button></td>
                </tr>
            </tbody>
         </table>

     


    </section>

    <script src="./scripts/104-form.js"></script>

</body>
</html>
