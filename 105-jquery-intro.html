    <title>jQuery Intro</title>

<body>

    <h1>Introduction to jQuery</h1>
    <h2>Practicing jQuery Actions</h2>


    <!-- Paragraph -->
    <p class="m-5">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Assumenda laudantium quis nemo recusandae      sit. Explicabo qui aspernatur suscipit eveniet corrupti culpa reiciendis nisi. Vero, vitae laborum sint rem ad dolorum?</p>

         <button id="triggerEventBtn" class="btn btn-secondary">Trigger Event</button>


         <!-- Buttons to manipulate the paragraph and pratice jQuery Actions -->

          <button id="toggleP" class="btn btn-danger">Toggle</button>

          <button id="applyClass" class="btn btn-dark">Apply CSS Class</button>
